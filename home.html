<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saylani Campus | Feed</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            color: #1e293b;
        }

        /* Saylani Brand Colors */
        :root {
            --saylani-green: #66b032;
            --saylani-green-light: #7cc44a;
            --saylani-green-dark: #4f8a26;
            --saylani-blue: #0057a8;
            --saylani-blue-light: #1a6cbc;
            --saylani-blue-dark: #00458c;
            --saylani-white: #ffffff;
            
            /* Neutrals */
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
            
            /* UI */
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --transition: all 0.2s ease;
        }

        /* Navbar */
        .navbar {
            background: white;
            border-bottom: 1px solid var(--gray-200);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--saylani-green), var(--saylani-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
        }

        .nav-link {
            color: var(--gray-600);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            transition: var(--transition);
        }

        .nav-link:hover {
            color: var(--saylani-green);
            background: var(--gray-100);
        }

        .nav-link.active {
            color: white;
            background: var(--saylani-green);
        }

        .nav-link i {
            margin-right: 0.5rem;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        /* Buttons */
        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            font-weight: 500;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--saylani-green);
            color: white;
        }

        .btn-primary:hover {
            background: var(--saylani-green-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--gray-100);
            color: var(--gray-700);
            border: 1px solid var(--gray-200);
        }

        .btn-secondary:hover {
            background: var(--gray-200);
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        /* User Menu */
        .user-menu {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.5rem 1rem;
            background: var(--gray-100);
            border-radius: 50px;
            border: 1px solid var(--gray-200);
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--saylani-green);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.9rem;
            overflow: hidden;
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-avatar i {
            font-size: 1rem;
        }

        #userEmail {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--gray-700);
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        /* Category Tabs */
        .category-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .category-tab {
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            background: white;
            border: 1px solid var(--gray-200);
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            color: var(--gray-600);
        }

        .category-tab:hover {
            border-color: var(--saylani-green);
            color: var(--saylani-green);
        }

        .category-tab.active {
            background: var(--saylani-green);
            color: white;
            border-color: var(--saylani-green);
        }

        /* Posts Grid */
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        /* Post Card */
        .post-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--gray-200);
            transition: var(--transition);
            cursor: pointer;
        }

        .post-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--saylani-green);
        }

        .post-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .post-content {
            padding: 1.5rem;
        }

        .post-category {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: var(--saylani-green);
            color: white;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .post-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--gray-800);
        }

        .post-text {
            color: var(--gray-600);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .post-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid var(--gray-200);
            font-size: 0.8rem;
        }

        .post-author {
            color: var(--gray-500);
        }

        .post-author i {
            color: var(--saylani-green);
        }

        .post-time {
            color: var(--gray-400);
        }

        .post-actions {
            display: flex;
            gap: 0.5rem;
        }

        .view-details-btn, .edit-post-btn {
            padding: 0.3rem 0.8rem;
            font-size: 0.7rem;
            background: var(--gray-100);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            color: var(--gray-600);
        }

        .view-details-btn:hover {
            background: var(--saylani-green);
            color: white;
        }

        .edit-post-btn:hover {
            background: var(--saylani-blue);
            color: white;
        }

        /* No Posts */
        .no-posts {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem;
            background: white;
            border-radius: 20px;
            border: 1px solid var(--gray-200);
        }

        .no-posts i {
            font-size: 3rem;
            color: var(--gray-300);
            margin-bottom: 1rem;
        }

        .no-posts h3 {
            color: var(--gray-600);
            margin-bottom: 0.5rem;
        }

        .no-posts p {
            color: var(--gray-500);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--gray-400);
            transition: var(--transition);
        }

        .close-modal:hover {
            color: var(--saylani-green);
        }

        /* Form Groups */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--gray-700);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--gray-200);
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--saylani-green);
            box-shadow: 0 0 0 3px rgba(102, 176, 50, 0.1);
        }

        /* Image Preview */
        .image-preview {
            margin-top: 1rem;
            border-radius: 12px;
            overflow: hidden;
        }

        .image-preview img {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
        }

        /* Form Actions */
        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        /* Post Details Modal */
        .post-details-modal {
            max-width: 800px;
        }

        .post-details-image {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 1.5rem;
        }

        .post-details-category {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: var(--saylani-green);
            color: white;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .post-details-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--gray-800);
        }

        .post-details-content {
            color: var(--gray-600);
            line-height: 1.8;
            margin-bottom: 2rem;
        }

        .post-details-footer {
            padding-top: 1rem;
            border-top: 1px solid var(--gray-200);
        }

        .post-details-author {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .author-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--saylani-green);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
            overflow: hidden;
        }

        .author-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .author-info h4 {
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: var(--gray-800);
        }

        .author-info p {
            color: var(--gray-500);
            font-size: 0.9rem;
        }

        /* Avatar Upload */
        .avatar-upload {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .avatar-preview {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--gray-100);
            overflow: hidden;
        }

        .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--gray-500);
        }

        

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* My Posts Button */
        #myPostsBtn a {
            text-decoration: none;
            color: inherit;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar {
                padding: 1rem;
            }
            
            .nav-container {
                flex-direction: column;
                gap: 1rem;
            }
            
            .nav-left {
                flex-direction: column;
                gap: 1rem;
                width: 100%;
            }
            
            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .nav-right {
                flex-wrap: wrap;
                justify-content: center;
                width: 100%;
            }
            
            .user-menu {
                width: 100%;
                justify-content: center;
            }
            
            .posts-grid {
                grid-template-columns: 1fr;
            }
            
            .form-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <h1 class="logo">Saylani Campus Connect</h1>
                <div class="nav-links">
                    <a href="#" class="nav-link active" data-category="all">
                        <i class="fas fa-home"></i> All Posts
                    </a>
                    <a href="#" class="nav-link" data-category="Technology">
                        <i class="fas fa-laptop-code"></i> Technology
                    </a>
                    <a href="#" class="nav-link" data-category="Lifestyle">
                        <i class="fas fa-heart"></i> Lifestyle
                    </a>
                    <a href="#" class="nav-link" data-category="Food">
                        <i class="fas fa-utensils"></i> Food
                    </a>
                    <a href="#" class="nav-link" data-category="Education">
                        <i class="fas fa-graduation-cap"></i> Education
                    </a>
                </div>
            </div>
            
            <div class="nav-right">
                <button id="myPostsBtn" class="btn btn-secondary">
                    <a href="my-posts.html"><i class="fas fa-user-circle"></i> My Posts</a>
                </button>
                <button id="createPostBtn" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Create Post
                </button>
                <div class="user-menu">
                    <div class="user-avatar" id="userAvatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <span id="userEmail">User</span>
                    <button id="editProfileBtn" class="btn btn-secondary">
                        <i class="fas fa-user-edit"></i>
                    </button>
                    <button id="logoutBtn" class="btn btn-secondary">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <!-- Category Filter Tabs -->
        <div class="category-tabs" id="categoryTabs">
            <!-- Will be populated by JavaScript -->
        </div>

        <!-- Posts Feed -->
       <!-- Posts Feed -->
<div class="feed-container">
    <div class="posts-grid" id="postsGrid">
        <div class="no-posts">
            <p>Loading posts...</p>
        </div>
    </div>
</div>

    <!-- Post Modal (for create/edit) -->
    <div class="modal" id="postModal">
        <div class="modal-content">
            <button class="close-modal" onclick="document.getElementById('postModal').style.display='none'">&times;</button>
            <h2 id="modalTitle">Create New Post</h2>
            <form id="postForm">
                <input type="hidden" id="postId" value="">
                
                <div class="form-group">
                    <label for="postTitle">Title</label>
                    <input type="text" id="postTitle" placeholder="Enter post title" required>
                </div>

                <div class="form-group">
                    <label for="postCategory">Category</label>
                    <select id="postCategory" required>
                        <option value="">Select Category</option>
                        <option value="Technology">Technology</option>
                        <option value="Lifestyle">Lifestyle</option>
                        <option value="Food">Food & Cooking</option>
                        <option value="Travel">Travel</option>
                        <option value="Education">Education</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="postContent">Content</label>
                    <textarea id="postContent" rows="6" placeholder="Write your post content..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="postImage">Image (optional)</label>
                    <input type="file" id="postImage" accept="image/*">
                    <div id="imagePreview" class="image-preview"></div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submitPostBtn">
                        <span id="submitBtnText">Publish Post</span>
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="document.getElementById('postModal').style.display='none'">Cancel</button>
                    <button type="button" id="deletePostBtn" class="btn btn-danger" style="display: none;">
                        <i class="fas fa-trash"></i> Delete
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Post Details Modal -->
    <div class="modal" id="postDetailsModal">
        <div class="modal-content post-details-modal">
            <button class="close-modal" id="closeDetails">&times;</button>
            <div id="postDetailsContent">
                <!-- Post details will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Profile Modal -->
    <div class="modal" id="profileModal">
        <div class="modal-content">
            <button class="close-modal" onclick="document.getElementById('profileModal').style.display='none'">&times;</button>
            <h2>Edit Profile</h2>
            <form id="profileForm">
                <div class="form-group">
                    <div class="avatar-upload">
                        <div class="avatar-preview" id="avatarPreview">
                            <img id="currentAvatar" src="" alt="Avatar">
                        </div>
                        <label for="avatarInput" class="btn btn-secondary">
                            <i class="fas fa-camera"></i> Change Photo
                        </label>
                        <input type="file" id="avatarInput" accept="image/*" style="display: none;">
                    </div>
                </div>

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="userBio">Bio</label>
                    <textarea id="userBio" rows="3" placeholder="Tell us about yourself..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Profile</button>
                    <button type="button" class="btn btn-secondary" onclick="document.getElementById('profileModal').style.display='none'">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="home.js"></script>
</body>
</html>
